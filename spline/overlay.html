<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Retro Flip Clock – split-flap</title>
<style>
  /* page stays transparent; only the sound pill captures pointer events */
  .sound {
    position: fixed; right: 16px; bottom: 16px; z-index: 10;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px; border: 0; border-radius: 999px;
    background: rgba(24, 22, 20, .72); color: #f5f1ea;
    font: 600 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .04em; cursor: pointer;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .sound .dot { width: 8px; height: 8px; border-radius: 50%; background: #7d766d; transition: background .2s, box-shadow .2s; }
  .sound[aria-pressed="true"] .dot { background: #fc6526; box-shadow: 0 0 8px #fc6526; }
  .sound:focus-visible { outline: 2px solid #fc6526; outline-offset: 2px; }
</style>
</head>
<body>
<button class="sound" id="sound" type="button" aria-pressed="false"><span class="dot"></span><span id="soundLabel">Sound off</span></button>
<script>
// Split-flap mechanism for the Retro Flip Clock.
// Shows the viewer's local time (24-hour). Each card has a moving flap on its hinge:
// the holdback tine swings clear, the flap falls forward 180° (revealing the new top half
// behind it) and lands with the new bottom half. Numbers are built from the digit outlines
// stored in the scene variable "glyphData" (Inter Bold, 52 pt) and clipped at the hinge line.
// The snail cams turn with the motor; each follower lever rides up its spiral and drops off
// the step at the moment its card flips.
(async () => {
  await spline.ready;

  const CUT = 0.4;                                          // half of the 0.8 mm gap between flap halves
  const FALL = 300, BOUNCE = 80, BOUNCE_DEG = 8;            // normal flip
  const FLICK_FALL = 150, FLICK_BOUNCE = 40, FLICK_DEG = 4; // fast flick on load
  const FLICK_STEPS = 6;
  const FLICK_LEVEL = 0.55;                                 // the flick plays softer

  const TINE_DEG = -60;        // the tine swings forward, toward the cover, to let the flap go
  const TINE_RELEASE = 0.25;   // share of the fall spent swinging clear
  const TINE_HOLD_DEG = 40;    // it springs back once the flap is past this angle
  const TINE_SPRING = 120;     // ms, with a small overshoot past rest

  // Snail cam: a spiral (radius 4 → 9 mm) on the drum spindle, one turn per card step.
  // Follower lever: pivot 13 mm above and 8.4 mm in front of the spindle, 8 mm long,
  // pointing down at -119.7° in its rest pose. Below 7.55 mm of cam it sits on its stop.
  const CAM_CONTACT = 9;       // where the follower touches the cam, degrees from +y toward +z
  const LEVER_LEN = 8, LEVER_PIVOT = Math.hypot(13, 8.4);
  const LEVER_OFFSET = Math.atan2(8.4, 13) * 180 / Math.PI + 119.7;

  // ---------- scene lookups ----------
  const find = async (name, optional) => {
    const o = await spline.findObjectByName(name);
    if (!o && !optional) console.warn('Clock: missing object "' + name + '"');
    return o;
  };
  const cards = {};
  for (const key of ['Hour', 'Minute']) {
    const ids = {};
    for (const part of ['Flap Pivot', 'Flap Front Glyph', 'Flap Back Glyph', 'Top Glyph', 'Bottom Glyph']) {
      const o = await find(key + ' ' + part);
      if (!o) return;
      ids[part] = o.id;
    }
    // the mechanism parts animate when present; the flip works without them
    const extra = async (part) => { const o = await find(key + ' ' + part, true); return o ? o.id : null; };
    cards[key] = {
      ids, mod: key === 'Hour' ? 24 : 60, value: key === 'Hour' ? '10' : '12', target: null, queue: [], busy: false,
      tine: await extra('Tine Pivot'), cam: await extra('Snail Cam'), lever: await extra('Cam Lever Pivot'), leverDeg: null
    };
  }

  // ---------- digit outlines ----------
  let data;
  try {
    const raw = await spline.getVariable('glyphData');
    data = JSON.parse(typeof raw === 'string' ? raw : (raw && raw.textValue) || '');
  } catch (e) {
    console.error('Clock: could not read the glyphData variable', e);
    return;
  }
  const bytes = (s) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; };
  const DIGITS = data.digits.map((d) => ({ w: d.w, xy: new Int16Array(bytes(d.v)), idx: new Uint16Array(bytes(d.i)) }));

  function clip(tri, keepTop) {
    const edge = keepTop ? CUT : -CUT;
    const inside = (p) => keepTop ? p[1] >= CUT : p[1] <= -CUT;
    const hit = (a, b) => { const t = (edge - a[1]) / (b[1] - a[1]); return [a[0] + t * (b[0] - a[0]), edge]; };
    const out = [];
    for (let k = 0; k < 3; k++) {
      const cur = tri[k], prev = tri[(k + 2) % 3];
      const ci = inside(cur), pi = inside(prev);
      if (ci) { if (!pi) out.push(hit(prev, cur)); out.push(cur); }
      else if (pi) out.push(hit(prev, cur));
    }
    return out;
  }
  function mesh(flat, mirror, nz) {                         // flat [x,y,...] triangle list → geometry write
    const n = flat.length / 2;
    const vertices = new Float32Array(n * 3), normals = new Float32Array(n * 3), indices = new Uint32Array(n);
    for (let i = 0; i < n; i++) {
      vertices[i * 3] = flat[i * 2];
      vertices[i * 3 + 1] = mirror ? -flat[i * 2 + 1] : flat[i * 2 + 1];
      normals[i * 3 + 2] = nz;
      indices[i] = i;
    }
    return { vertices, normals, indices };
  }

  const cache = new Map();
  function glyph(str) {
    if (cache.has(str)) return cache.get(str);
    const a = DIGITS[+str[0]], b = DIGITS[+str[1]], q = data.q;
    const offset = a.w + data.gaps[+str];
    const pts = [], tris = [];
    const add = (g, dx) => {
      const base = pts.length / 2;
      for (let k = 0; k < g.xy.length; k += 2) pts.push(g.xy[k] / q + dx, g.xy[k + 1] / q);
      for (let k = 0; k < g.idx.length; k++) tris.push(g.idx[k] + base);
    };
    add(a, 0);
    add(b, offset);
    let minY = Infinity, maxY = -Infinity;
    for (let k = 1; k < pts.length; k += 2) { if (pts[k] < minY) minY = pts[k]; if (pts[k] > maxY) maxY = pts[k]; }
    const cx = (offset + b.w) / 2, cy = (minY + maxY) / 2;
    const top = [], bottom = [];
    const emit = (poly, out) => { for (let k = 1; k + 1 < poly.length; k++) out.push(poly[0][0], poly[0][1], poly[k][0], poly[k][1], poly[k + 1][0], poly[k + 1][1]); };
    for (let t = 0; t < tris.length; t += 3) {
      const tri = [0, 1, 2].map((j) => [pts[tris[t + j] * 2] - cx, pts[tris[t + j] * 2 + 1] - cy]);
      emit(clip(tri, true), top);
      emit(clip(tri, false), bottom);
    }
    const g = { top: mesh(top, false, 1), bottom: mesh(bottom, false, 1), back: mesh(bottom, true, -1) };
    cache.set(str, g);
    return g;
  }
  const write = (id, m) => spline.updateObject(id, { geometry: { vertices: m.vertices, normals: m.normals, indices: m.indices } });

  // ---------- sound (procedural WebAudio, off until the visitor turns it on) ----------
  // slip: the tine lets go (a tiny dry tick). flump: the tile drops and slaps the one below
  // (a soft thud, a damped slap and the hollow case ringing). settle: the bounce coming to rest.
  const sfx = (() => {
    let ctx = null, out = null, noise = null, on = false;
    function init() {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor();             // keeps quick flicks from stacking into clipping
      comp.threshold.value = -20; comp.knee.value = 10; comp.ratio.value = 4;
      comp.attack.value = 0.002; comp.release.value = 0.1;
      out = ctx.createGain(); out.gain.value = 0.8;
      out.connect(comp).connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 0.3);
      noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    const vary = (amount) => 1 + (Math.random() * 2 - 1) * amount;
    const filter = (type, freq, q) => { const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q || 0.707; return f; };
    function envelope(param, when, peak, attack, decay) {
      param.setValueAtTime(0.0001, when);
      param.exponentialRampToValueAtTime(peak, when + attack);
      param.exponentialRampToValueAtTime(0.0001, when + attack + decay);
    }
    function noiseHit(chain, peak, attack, decay, when) {
      const src = ctx.createBufferSource(); src.buffer = noise;
      let node = src;
      for (const f of chain) { node.connect(f); node = f; }
      const g = ctx.createGain();
      envelope(g.gain, when, peak, attack, decay);
      node.connect(g).connect(out);
      src.start(when, Math.random() * 0.1);
      src.stop(when + attack + decay + 0.03);
    }
    function playSlip(level) {
      noiseHit([filter('highpass', 1800), filter('bandpass', 2800 * vary(0.06), 3)], 0.06 * level, 0.0008, 0.006, ctx.currentTime);
    }
    function playFlump(level) {
      const t = ctx.currentTime, p = vary(0.06);
      level *= vary(0.1);
      // thud: the tile's weight
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(170 * p, t);
      o.frequency.exponentialRampToValueAtTime(95 * p, t + 0.06);
      const g = ctx.createGain();
      envelope(g.gain, t, 0.5 * level, 0.002, 0.088);
      o.connect(g).connect(out);
      o.start(t); o.stop(t + 0.12);
      // slap: card on card, darkening as it damps
      const lp = filter('lowpass', 1400 * p);
      lp.frequency.setValueAtTime(1400 * p, t);
      lp.frequency.exponentialRampToValueAtTime(500 * p, t + 0.035);
      noiseHit([lp], 0.9 * level, 0.0015, 0.035, t);
      // hollow case resonance
      noiseHit([filter('bandpass', 480 * p, 6)], 2.4 * level, 0.002, 0.11, t);
    }
    return {
      async toggle() {
        if (!ctx) init();
        on = !on;
        if (on && ctx.state !== 'running') await ctx.resume();
        return on;
      },
      slip(level) { if (on && ctx) playSlip(level); },
      flump(level) { if (on && ctx) playFlump(level); },
      settle(level) { if (on && ctx) playFlump(0.3 * level); }
    };
  })();
  const btn = document.getElementById('sound');
  btn.addEventListener('click', async () => {
    const on = await sfx.toggle();
    btn.setAttribute('aria-pressed', String(on));
    document.getElementById('soundLabel').textContent = on ? 'Sound on' : 'Sound off';
  });

  // ---------- flap and tine motion ----------
  const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const tineHold = (fall) => fall * Math.sqrt(TINE_HOLD_DEG / 180);   // the flap angle is 180·p², so it passes TINE_HOLD_DEG here

  // Swing clear early in the fall, hold while the flap goes past, then spring back with a small overshoot
  function tineAngle(t, fall) {
    const release = fall * TINE_RELEASE, hold = tineHold(fall);
    if (t < release) return TINE_DEG * easeOut(t / release);
    if (t < hold) return TINE_DEG;
    const u = (t - hold) / TINE_SPRING;
    if (u >= 1) return 0;
    if (u < 0.6) return TINE_DEG + (6 - TINE_DEG) * easeOut(u / 0.6);
    return 6 * (1 - easeInOut((u - 0.6) / 0.4));
  }

  function swing(card, fall, bounce, bounceDeg, level) {
    const pivot = card.ids['Flap Pivot'], tine = card.tine;
    const end = Math.max(fall + bounce, tine ? tineHold(fall) + TINE_SPRING : 0);
    sfx.slip(level);
    return new Promise((done) => {
      const t0 = performance.now();
      let landed = false, settled = false;
      (function tick(now) {
        const t = now - t0;
        if (t < fall) {
          const p = t / fall;
          spline.updateObject(pivot, { rotation: { x: 180 * p * p } });   // gravity-like ease-in
        } else if (t < fall + bounce) {
          if (!landed) { landed = true; sfx.flump(level); }
          const q = (t - fall) / bounce;
          spline.updateObject(pivot, { rotation: { x: 180 - bounceDeg * Math.sin(Math.PI * q) } });
        } else if (!settled) {
          if (!landed) { landed = true; sfx.flump(level); }
          settled = true;
          sfx.settle(level);
          spline.updateObject(pivot, { rotation: { x: 180 } });
        }
        if (tine) spline.updateObject(tine, { rotation: { x: tineAngle(t, fall) } });
        if (t >= end) { done(); return; }
        requestAnimationFrame(tick);
      })(t0);
    });
  }

  async function flipTo(card, to, fast) {
    const g = glyph(to);
    const ids = card.ids;
    await Promise.all([write(ids['Top Glyph'], g.top), write(ids['Flap Back Glyph'], g.back)]);
    await swing(card, fast ? FLICK_FALL : FALL, fast ? FLICK_BOUNCE : BOUNCE, fast ? FLICK_DEG : BOUNCE_DEG, fast ? FLICK_LEVEL : 1);
    await Promise.all([write(ids['Bottom Glyph'], g.bottom), write(ids['Flap Front Glyph'], g.top)]);
    await frame(); await frame();
    spline.updateObject(ids['Flap Pivot'], { rotation: { x: 0 } });   // invisible reset: front now matches the top half behind it
    card.value = to;
  }

  function enqueue(card, values, fast) {
    for (const v of values) card.queue.push({ v, fast });
    if (!card.busy) drain(card);
  }
  async function drain(card) {
    card.busy = true;
    try {
      while (card.queue.length) {
        const { v, fast } = card.queue.shift();
        if (v !== card.value) await flipTo(card, v, fast);
      }
    } catch (e) {
      console.error('Clock: flip failed', e);
    }
    card.busy = false;
  }

  // ---------- snail cams and follower levers ----------
  // Lever angle that puts its tip on the cam radius under it (law of cosines about the spindle)
  function leverAngle(frac) {
    const reach = Math.max(4 + 5 * frac, 7.55) + 0.55;      // cam radius under the follower + half the lever's thickness
    const c = (reach * reach - LEVER_PIVOT * LEVER_PIVOT - LEVER_LEN * LEVER_LEN) / (2 * LEVER_PIVOT * LEVER_LEN);
    return LEVER_OFFSET - Math.acos(Math.max(-1, Math.min(1, c))) * 180 / Math.PI;
  }
  function snap(id, to) {                                    // the follower falls off the step with a small rebound
    const t0 = performance.now();
    (function tick(now) {
      const u = Math.min(1, (now - t0) / 140);
      spline.updateObject(id, { rotation: { x: to + 2.5 * Math.sin(2 * Math.PI * u) * (1 - u) } });
      if (u < 1) requestAnimationFrame(tick);
    })(t0);
  }
  function turn(card, frac) {                                // frac: 0 → 1 over one card step
    if (card.cam) spline.updateObject(card.cam, { rotation: { x: CAM_CONTACT + 360 * frac, y: 180, z: 0 } });
    if (!card.lever) return;
    const to = leverAngle(frac), from = card.leverDeg;
    card.leverDeg = to;
    if (from !== null && from - to > 5) snap(card.lever, to);
    else spline.updateObject(card.lever, { rotation: { x: to } });
  }
  function turnCams() {                                      // steps once a second, like the quartz motor
    const d = new Date(), s = d.getSeconds(), m = d.getMinutes();
    turn(cards.Minute, s / 60);
    turn(cards.Hour, (m + s / 60) / 60);
  }

  // ---------- time ----------
  const pad = (n) => String(n).padStart(2, '0');
  const now = () => { const d = new Date(); return { h: pad(d.getHours()), m: pad(d.getMinutes()) }; };
  const seq = (target, mod, steps) => { const t = +target, out = []; for (let i = steps; i >= 0; i--) out.push(pad(((t - i) % mod + mod) % mod)); return out; };

  function sync(fast, steps) {
    const n = now();
    cards.Hour.target = n.h; cards.Minute.target = n.m;
    enqueue(cards.Minute, steps ? seq(n.m, 60, steps) : [n.m], fast);
    enqueue(cards.Hour, steps ? seq(n.h, 24, steps) : [n.h], fast);
  }

  turnCams();
  sync(true, FLICK_STEPS);   // load: quick flick that lands on the current time

  setInterval(() => {
    turnCams();
    const n = now();
    if (n.m !== cards.Minute.target) { cards.Minute.target = n.m; enqueue(cards.Minute, [n.m], false); }
    if (n.h !== cards.Hour.target) { cards.Hour.target = n.h; enqueue(cards.Hour, [n.h], false); }
  }, 250);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    for (const c of Object.values(cards)) c.queue.length = 0;
    sync(false, 0);
  });

  // ---------- demo hooks: press F, or add ?flipdemo to the URL ----------
  const demo = () => sync(true, 3);
  addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') demo(); });
  if (/flipdemo/.test(location.search + location.hash + (document.referrer || ''))) setInterval(demo, 6000);

  console.log('Clock: split-flap running, local time ' + now().h + ':' + now().m);
})();
</script>
</body>
</html>
