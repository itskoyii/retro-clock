<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Retro Flip Clock – split-flap</title>
<style>
  /* page stays transparent; only the sound pill captures pointer events */
  .sound {
    position: fixed; right: 16px; bottom: 16px; z-index: 10;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px; border: 0; border-radius: 999px;
    background: rgba(24, 22, 20, .72); color: #f5f1ea;
    font: 600 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .04em; cursor: pointer;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .sound .dot { width: 8px; height: 8px; border-radius: 50%; background: #7d766d; transition: background .2s, box-shadow .2s; }
  .sound[aria-pressed="true"] .dot { background: #ff7a3d; box-shadow: 0 0 8px #ff7a3d; }
  .sound:focus-visible { outline: 2px solid #ff7a3d; outline-offset: 2px; }
</style>
</head>
<body>
<button class="sound" id="sound" type="button" aria-pressed="false"><span class="dot"></span><span id="soundLabel">Sound off</span></button>
<script>
// Split-flap mechanism for the Retro Flip Clock.
// Shows the viewer's local time (24-hour). Each card has a moving flap on its hinge:
// the flap falls forward 180°, revealing the new top half behind it and landing
// with the new bottom half. Numbers are built from the digit outlines stored in the
// scene variable "glyphData" (Inter Bold, 52 pt) and clipped at the hinge line.
(async () => {
  await spline.ready;

  const CUT = 0.4;                                          // half of the 0.8 mm gap between flap halves
  const FALL = 300, BOUNCE = 80, BOUNCE_DEG = 8;            // normal flip
  const FLICK_FALL = 150, FLICK_BOUNCE = 40, FLICK_DEG = 4; // fast flick on load
  const FLICK_STEPS = 6;

  // ---------- scene lookups ----------
  const find = async (name) => {
    const o = await spline.findObjectByName(name);
    if (!o) console.warn('Clock: missing object "' + name + '"');
    return o;
  };
  const cards = {};
  for (const key of ['Hour', 'Minute']) {
    const ids = {};
    for (const part of ['Flap Pivot', 'Flap Front Glyph', 'Flap Back Glyph', 'Top Glyph', 'Bottom Glyph']) {
      const o = await find(key + ' ' + part);
      if (!o) return;
      ids[part] = o.id;
    }
    cards[key] = { ids, mod: key === 'Hour' ? 24 : 60, value: key === 'Hour' ? '10' : '12', target: null, queue: [], busy: false };
  }

  // ---------- digit outlines ----------
  let data;
  try {
    const raw = await spline.getVariable('glyphData');
    data = JSON.parse(typeof raw === 'string' ? raw : (raw && raw.textValue) || '');
  } catch (e) {
    console.error('Clock: could not read the glyphData variable', e);
    return;
  }
  const bytes = (s) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; };
  const DIGITS = data.digits.map((d) => ({ w: d.w, xy: new Int16Array(bytes(d.v)), idx: new Uint16Array(bytes(d.i)) }));

  function clip(tri, keepTop) {
    const edge = keepTop ? CUT : -CUT;
    const inside = (p) => keepTop ? p[1] >= CUT : p[1] <= -CUT;
    const hit = (a, b) => { const t = (edge - a[1]) / (b[1] - a[1]); return [a[0] + t * (b[0] - a[0]), edge]; };
    const out = [];
    for (let k = 0; k < 3; k++) {
      const cur = tri[k], prev = tri[(k + 2) % 3];
      const ci = inside(cur), pi = inside(prev);
      if (ci) { if (!pi) out.push(hit(prev, cur)); out.push(cur); }
      else if (pi) out.push(hit(prev, cur));
    }
    return out;
  }
  function mesh(flat, mirror, nz) {                         // flat [x,y,...] triangle list → geometry write
    const n = flat.length / 2;
    const vertices = new Float32Array(n * 3), normals = new Float32Array(n * 3), indices = new Uint32Array(n);
    for (let i = 0; i < n; i++) {
      vertices[i * 3] = flat[i * 2];
      vertices[i * 3 + 1] = mirror ? -flat[i * 2 + 1] : flat[i * 2 + 1];
      normals[i * 3 + 2] = nz;
      indices[i] = i;
    }
    return { vertices, normals, indices };
  }

  const cache = new Map();
  function glyph(str) {
    if (cache.has(str)) return cache.get(str);
    const a = DIGITS[+str[0]], b = DIGITS[+str[1]], q = data.q;
    const offset = a.w + data.gaps[+str];
    const pts = [], tris = [];
    const add = (g, dx) => {
      const base = pts.length / 2;
      for (let k = 0; k < g.xy.length; k += 2) pts.push(g.xy[k] / q + dx, g.xy[k + 1] / q);
      for (let k = 0; k < g.idx.length; k++) tris.push(g.idx[k] + base);
    };
    add(a, 0);
    add(b, offset);
    let minY = Infinity, maxY = -Infinity;
    for (let k = 1; k < pts.length; k += 2) { if (pts[k] < minY) minY = pts[k]; if (pts[k] > maxY) maxY = pts[k]; }
    const cx = (offset + b.w) / 2, cy = (minY + maxY) / 2;
    const top = [], bottom = [];
    const emit = (poly, out) => { for (let k = 1; k + 1 < poly.length; k++) out.push(poly[0][0], poly[0][1], poly[k][0], poly[k][1], poly[k + 1][0], poly[k + 1][1]); };
    for (let t = 0; t < tris.length; t += 3) {
      const tri = [0, 1, 2].map((j) => [pts[tris[t + j] * 2] - cx, pts[tris[t + j] * 2 + 1] - cy]);
      emit(clip(tri, true), top);
      emit(clip(tri, false), bottom);
    }
    const g = { top: mesh(top, false, 1), bottom: mesh(bottom, false, 1), back: mesh(bottom, true, -1) };
    cache.set(str, g);
    return g;
  }
  const write = (id, m) => spline.updateObject(id, { geometry: { vertices: m.vertices, normals: m.normals, indices: m.indices } });

  // ---------- sound (procedural WebAudio, off until the visitor turns it on) ----------
  const sfx = (() => {
    let ctx = null, master = null, noise = null, on = false;
    function init() {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.7; master.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 0.08);
      noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    const jit = () => 0.95 + Math.random() * 0.1;
    function burst(freq, q, peak, decay, when) {
      const s = ctx.createBufferSource(); s.buffer = noise;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(peak, when + 0.001);
      g.gain.exponentialRampToValueAtTime(0.0001, when + decay);
      s.connect(f).connect(g).connect(master);
      s.start(when); s.stop(when + decay + 0.02);
    }
    function thump(freq, peak, decay, when) {
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(freq * 1.4, when);
      o.frequency.exponentialRampToValueAtTime(freq, when + decay * 0.6);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(peak, when + 0.002);
      g.gain.exponentialRampToValueAtTime(0.0001, when + decay);
      o.connect(g).connect(master);
      o.start(when); o.stop(when + decay + 0.02);
    }
    return {
      async toggle() {
        if (!ctx) init();
        on = !on;
        if (on && ctx.state !== 'running') await ctx.resume();
        return on;
      },
      tick(fast) { if (!on || !ctx) return; burst(3500 * jit(), 1.4, fast ? 0.12 : 0.18, 0.009, ctx.currentTime); },
      clack(fast) {
        if (!on || !ctx) return;
        const t = ctx.currentTime;
        burst(1800 * jit(), 0.9, fast ? 0.35 : 0.55, 0.025, t);
        thump(160 * jit(), fast ? 0.3 : 0.45, 0.03, t);
      }
    };
  })();
  const btn = document.getElementById('sound');
  btn.addEventListener('click', async () => {
    const on = await sfx.toggle();
    btn.setAttribute('aria-pressed', String(on));
    document.getElementById('soundLabel').textContent = on ? 'Sound on' : 'Sound off';
  });

  // ---------- flap motion ----------
  const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
  function swing(card, fall, bounce, bounceDeg, fast) {
    const pivot = card.ids['Flap Pivot'];
    return new Promise((done) => {
      const t0 = performance.now();
      let landed = false;
      (function tick(now) {
        const t = now - t0;
        if (t < fall) {
          const p = t / fall;
          spline.updateObject(pivot, { rotation: { x: 180 * p * p } });   // gravity-like ease-in
        } else if (t < fall + bounce) {
          if (!landed) { landed = true; sfx.clack(fast); }
          const q = (t - fall) / bounce;
          spline.updateObject(pivot, { rotation: { x: 180 - bounceDeg * Math.sin(Math.PI * q) } });
        } else {
          if (!landed) { landed = true; sfx.clack(fast); }
          spline.updateObject(pivot, { rotation: { x: 180 } });
          done();
          return;
        }
        requestAnimationFrame(tick);
      })(t0);
    });
  }

  async function flipTo(card, to, fast) {
    const g = glyph(to);
    const ids = card.ids;
    await Promise.all([write(ids['Top Glyph'], g.top), write(ids['Flap Back Glyph'], g.back)]);
    sfx.tick(fast);
    await swing(card, fast ? FLICK_FALL : FALL, fast ? FLICK_BOUNCE : BOUNCE, fast ? FLICK_DEG : BOUNCE_DEG, fast);
    await Promise.all([write(ids['Bottom Glyph'], g.bottom), write(ids['Flap Front Glyph'], g.top)]);
    await frame(); await frame();
    spline.updateObject(ids['Flap Pivot'], { rotation: { x: 0 } });   // invisible reset: front now matches the top half behind it
    card.value = to;
  }

  function enqueue(card, values, fast) {
    for (const v of values) card.queue.push({ v, fast });
    if (!card.busy) drain(card);
  }
  async function drain(card) {
    card.busy = true;
    try {
      while (card.queue.length) {
        const { v, fast } = card.queue.shift();
        if (v !== card.value) await flipTo(card, v, fast);
      }
    } catch (e) {
      console.error('Clock: flip failed', e);
    }
    card.busy = false;
  }

  // ---------- time ----------
  const pad = (n) => String(n).padStart(2, '0');
  const now = () => { const d = new Date(); return { h: pad(d.getHours()), m: pad(d.getMinutes()) }; };
  const seq = (target, mod, steps) => { const t = +target, out = []; for (let i = steps; i >= 0; i--) out.push(pad(((t - i) % mod + mod) % mod)); return out; };

  function sync(fast, steps) {
    const n = now();
    cards.Hour.target = n.h; cards.Minute.target = n.m;
    enqueue(cards.Minute, steps ? seq(n.m, 60, steps) : [n.m], fast);
    enqueue(cards.Hour, steps ? seq(n.h, 24, steps) : [n.h], fast);
  }

  sync(true, FLICK_STEPS);   // load: quick flick that lands on the current time

  setInterval(() => {
    const n = now();
    if (n.m !== cards.Minute.target) { cards.Minute.target = n.m; enqueue(cards.Minute, [n.m], false); }
    if (n.h !== cards.Hour.target) { cards.Hour.target = n.h; enqueue(cards.Hour, [n.h], false); }
  }, 250);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    for (const c of Object.values(cards)) c.queue.length = 0;
    sync(false, 0);
  });

  // ---------- demo hooks: press F, or add ?flipdemo to the URL ----------
  const demo = () => sync(true, 3);
  addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') demo(); });
  if (/flipdemo/.test(location.search + location.hash + (document.referrer || ''))) setInterval(demo, 6000);

  console.log('Clock: split-flap running, local time ' + now().h + ':' + now().m);
})();
</script>
</body>
</html>
